; PlatformIO Project Configuration File for ESP32-S3 People Detection System
; Platform: Espressif 32
; Framework: Arduino

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor & Upload Configuration
monitor_speed = 115200
upload_speed = 921600

; COM Port Configuration
; (Check your COM port in Windows Device Manager -> Ports (COM & LPT))
upload_port = COM9
monitor_port = COM9

; ESP32-S3 Hardware UART Serial output support for COM bridge
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=0
    -D CORE_DEBUG_LEVEL=1

; External Libraries
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
